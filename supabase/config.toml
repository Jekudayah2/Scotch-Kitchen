# Supabase CLI configuration for SCOTCH's Kitchen.
# Used by `supabase start` (local stack) and `supabase functions deploy`.

project_id = "scotchs-kitchen"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/reset-password",
  "http://127.0.0.1:5173/auth/callback",
  "http://127.0.0.1:5173/reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Browser-facing payment functions require a signed-in user's JWT.
[functions.paystack-initialize]
verify_jwt = true

[functions.paystack-verify]
verify_jwt = true

# Paystack calls the webhook without a Supabase JWT; it is authenticated by
# its HMAC-SHA512 signature instead.
[functions.paystack-webhook]
verify_jwt = false
